// DigiEngine X for Android: SDL2's Java activity plus the game compiled with CMake
// (app/jni/CMakeLists.txt). Packs are bundled as assets.
apply plugin: 'com.android.application'

// SDL2's source folder (for its Android build). Set sdl2.dir in
// local.properties, or the SDL2_DIR environment variable.
def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) localFile.withInputStream { localProps.load(it) }
def sdl2Dir = localProps.getProperty('sdl2.dir') ?: System.getenv('SDL2_DIR')
if (sdl2Dir == null) throw new GradleException('Set sdl2.dir in platform/android/local.properties (see platform/android/README.md)')

android {
    namespace "org.libsdl.app"  // SDL's Java classes and their JNI names live here
    compileSdkVersion 34
    ndkVersion "26.3.11579264"
    defaultConfig {
        applicationId "io.github.vpet"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "0.1"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static", "-DSDL2_SOURCE_DIR=" + sdl2Dir.replace('\\', '/')
                abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug  // installable without a store key; not for the Play Store
        }
    }
    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
            version '3.22.1'
        }
    }
    sourceSets.main.assets.srcDirs = ["$buildDir/generated/vpet-assets"]
    lint {
        abortOnError false
    }
}

// Copies every pack in the repo's packs/ folder (including local ones) into
// the APK, plus packs/index.txt naming them, since APK assets can't be listed.
// -Ppacks=demo (comma-separated) bundles only those, e.g. for a public release.
def packsDir = file('../../../packs')
def assetsOut = file("$buildDir/generated/vpet-assets")
def onlyPacks = project.findProperty('packs')?.toString()?.split(',')*.trim()
tasks.register('bundlePacks') {
    inputs.dir packsDir
    inputs.property 'packs', onlyPacks ?: []
    outputs.dir assetsOut
    doLast {
        delete assetsOut
        // Only real packs (folders with a pack.json); source folders stay out.
        def names = packsDir.listFiles().findAll { it.isDirectory() && new File(it, 'pack.json').exists() }*.name.sort()
        if (onlyPacks) names = names.findAll { it in onlyPacks }
        if (names.isEmpty()) throw new GradleException("no packs to bundle (packs=$onlyPacks)")
        names.each { name ->
            copy {
                from new File(packsDir, name)
                into "$assetsOut/packs/$name"
            }
        }
        new File("$assetsOut/packs/index.txt").text = names.join('\n') + '\n'
    }
}
preBuild.dependsOn bundlePacks
